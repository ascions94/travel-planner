<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Planner</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="hero">
    <div class="hero-content">
        <h1>🌍 Travel Planner</h1>
        <p>Crea il tuo viaggio perfetto, giorno dopo giorno.</p>

        <div class="planner-box">
            <label for="destination">Dove vuoi andare?</label>
            <input
                type="text"
                id="destination"
                placeholder="Es. Londra, Tokyo, Budapest"
            >
            <label for="start-date">Quando parti?</label>
<input type="date" id="start-date">

<label for="days">Quanti giorni?</label>
<input type="number" id="days" min="1" max="30" placeholder="Es. 4">

            <button id="create-trip">Crea itinerario</button>
            <button id="new-trip" class="new-trip-button">
    🗑️ Nuovo viaggio
</button>
        </div>
        <div id="trip-result" class="trip-result"></div>

        <div id="activity-form" class="activity-form hidden">

    <h3 id="activity-form-title">➕ Aggiungi attività</h3>

    <label for="activity-time">Orario</label>
    <input type="time" id="activity-time">

    <label for="activity-name">Attività</label>
    <input
        type="text"
        id="activity-name"
        placeholder="Es. Cena a Soho"
    >

<p id="activity-error" class="activity-error hidden"></p>

    <div class="activity-form-actions">
        <button id="save-activity">Salva attività</button>
        <button id="cancel-activity">Annulla</button>
    </div>

</div>
    </div>
</main>
<script src="script.js"></script>
</body>

</html>
